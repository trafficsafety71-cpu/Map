<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حدود الدمام</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1 {
    font-size: 22px;
    text-align: center;
    margin: 10px 0 4px;
    color: #f8fafc;
  }
  .subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 22px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 14px;
    color: #cbd5e1;
    margin-bottom: 8px;
    font-weight: 600;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 15px;
    direction: ltr;
    text-align: left;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #38bdf8;
  }
  .hint {
    font-size: 12px;
    color: #64748b;
    margin-top: 8px;
    line-height: 1.6;
  }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s;
  }
  button:active { transform: scale(0.98); }
  button:hover { opacity: 0.92; }

  .result {
    margin-top: 16px;
    padding: 16px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    display: none;
  }
  .result.inside {
    background: rgba(34,197,94,0.15);
    border: 1px solid #22c55e;
    color: #4ade80;
    display: block;
  }
  .result.outside {
    background: rgba(239,68,68,0.15);
    border: 1px solid #ef4444;
    color: #f87171;
    display: block;
  }
  .result.error {
    background: rgba(234,179,8,0.15);
    border: 1px solid #eab308;
    color: #fde047;
    display: block;
  }
  .coords-echo {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 6px;
    direction: ltr;
    text-align: center;
  }
  #map {
    height: 420px;
    width: 100%;
    border-radius: 14px;
    border: 1px solid #334155;
  }
  #map:fullscreen,
  #map:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
  }
  /* بديل الشاشة الكاملة عبر CSS للمتصفحات التي لا تدعم Fullscreen API (مثل Safari على iOS) */
  #map.leaflet-fake-fullscreen {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-width: none !important;
    border-radius: 0 !important;
    border: none !important;
    z-index: 99999 !important;
  }
  .examples {
    font-size: 12px;
    color: #64748b;
    margin-top: 10px;
  }
  .examples code {
    background: #0f172a;
    padding: 2px 6px;
    border-radius: 6px;
    color: #7dd3fc;
    direction: ltr;
    display: inline-block;
  }
  .footer-note {
    text-align: center;
    color: #475569;
    font-size: 12px;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>خريطة الحدود الإدارية بمرور الدمام</h1>
  <div class="subtitle">أدخل رقم إحداثية أو رابط خرائط قوقل لمعرفة إن كان الموقع داخل الحدود أو خارجها</div>

  <div class="card">
    <label for="coordInput">الإحداثية أو رابط Google Maps</label>
    <input type="text" id="coordInput" placeholder="الصق هنا" />
    <button onclick="checkPoint()">تحقق من الموقع</button>
    <div id="result" class="result"></div>
    <div id="coordsEcho" class="coords-echo"></div>
  </div>

  <div class="card">
    <div id="map"></div>
  </div>

  <div class="footer-note">تصميم: علي الغامدي</div>
</div>

// ==== خوارزمية Ray Casting لتحديد هل النقطة داخل المضلع ====
function isPointInPolygon(point, polygon) {
  const x = point[1], y = point[0]; // lng, lat
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const xi = polygon[i][1], yi = polygon[i][0];
    const xj = polygon[j][1], yj = polygon[j][0];
    const intersect = ((yi > y) !== (yj > y)) &&
      (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// ==== استخراج الإحداثية من نص أو رابط ====
function extractCoordinates(input) {
  input = input.trim();

  function valid(lat, lng) {
    if (isNaN(lat) || isNaN(lng)) return null;
    // فحص النطاق المسموح لأي إحداثية حقيقية، لتفادي قبول أرقام عشوائية بالخطأ
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
    return [lat, lng];
  }

  // نمط: @lat,lng في روابط Google Maps
  let m = input.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) { const r = valid(parseFloat(m[1]), parseFloat(m[2])); if (r) return r; }

  // نمط: q=lat,lng أو ll=lat,lng
  m = input.match(/[?&](?:q|ll|query)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) { const r = valid(parseFloat(m[1]), parseFloat(m[2])); if (r) return r; }

  // نمط: lat,lng مباشرة (مع أو بدون مسافات)
  m = input.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if (m) { const r = valid(parseFloat(m[1]), parseFloat(m[2])); if (r) return r; }

  return null;
}

// ==== إعداد الخريطة ====
// تم تغليف تهيئة الخريطة بالكامل بمعالجة أخطاء (try/catch) حتى لو حدث خطأ غير متوقع
// (مثل تعذر تحميل مكتبة الخريطة) تظهر رسالة واضحة للمستخدم بدل شاشة خريطة فارغة صامتة
try {
const map = L.map('map').setView([26.45, 50.0], 10);

// طبقات خرائط جوجل الثلاث
const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
  attribution: '&copy; Google Maps',
  maxZoom: 20,
  subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
});
const googleSatellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  attribution: '&copy; Google Maps',
  maxZoom: 20,
  subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
});
const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
  attribution: '&copy; Google Maps',
  maxZoom: 20,
  subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
});

// طبقة احتياطية (OpenStreetMap) تعمل تلقائيًا إذا تعذّر تحميل طبقات قوقل (حجب/تقييد مؤقت)
const fallbackLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
});
let usingFallback = false;
let firstTileLoaded = false;
function switchToFallback() {
  if (usingFallback) return;
  usingFallback = true;
  [googleHybrid, googleStreets, googleSatellite].forEach(function (l) { if (map.hasLayer(l)) map.removeLayer(l); });
  fallbackLayer.addTo(map);
}
[googleHybrid, googleStreets, googleSatellite].forEach(function (l) {
  l.on('tileerror', switchToFallback);
});
googleHybrid.on('load', function () { firstTileLoaded = true; });

// الطبقة الافتراضية: الهجين
googleHybrid.addTo(map);
setTimeout(function () { if (!firstTileLoaded) switchToFallback(); }, 4000);

L.control.layers({
  'هجين (افتراضي)': googleHybrid,
  'خريطة الشوارع': googleStreets,
  'قمر صناعي': googleSatellite,
  'بديل (OpenStreetMap)': fallbackLayer
}).addTo(map);

const polygon = L.polygon(polygonCoords, {
  color: '#f97316',
  weight: 3,
  fillColor: '#f97316',
  fillOpacity: 0.12
}).addTo(map);
map.fitBounds(polygon.getBounds());

// ==== زر "شاشة كاملة" تحت أزرار التكبير/التصغير مباشرة ====
const expandIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4"/><path d="M15 3h4a2 2 0 0 1 2 2v4"/><path d="M9 21H5a2 2 0 0 1-2-2v-4"/><path d="M15 21h4a2 2 0 0 0 2-2v-4"/></svg>';
const collapseIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M16 3v3a2 2 0 0 0 2 2h3"/><path d="M8 21v-3a2 2 0 0 0-2-2H3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';

const FullscreenControl = L.Control.extend({
  options: { position: 'topleft' },
  onAdd: function (map) {
    const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-fullscreen');
    const link = L.DomUtil.create('a', '', container);
    link.href = '#';
    link.title = 'شاشة كاملة';
    link.setAttribute('role', 'button');
    link.setAttribute('aria-label', 'شاشة كاملة');
    link.innerHTML = expandIcon;
    link.style.display = 'flex';
    link.style.alignItems = 'center';
    link.style.justifyContent = 'center';

    const mapContainer = map.getContainer();
    // بعض المتصفحات (مثل Safari على iOS) لا تدعم Fullscreen API إطلاقًا على عنصر
    // عادي مثل الخريطة، لذلك نستخدم بديلًا يعتمد على CSS فقط (محاكاة شاشة كاملة
    // بتثبيت موضع عنصر الخريطة ليغطي الشاشة بالكامل) عندما تكون الـ API غير مدعومة.
    const nativeSupported = !!(
      mapContainer.requestFullscreen || mapContainer.webkitRequestFullscreen
    );
    let manualActive = false;

    function isFullscreen() {
      return manualActive || !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function updateIcon() {
      link.innerHTML = isFullscreen() ? collapseIcon : expandIcon;
      link.title = isFullscreen() ? 'إنهاء الشاشة الكاملة' : 'شاشة كاملة';
    }

    function enterManual() {
      manualActive = true;
      L.DomUtil.addClass(mapContainer, 'leaflet-fake-fullscreen');
      document.body.style.overflow = 'hidden';
      updateIcon();
      setTimeout(function () { map.invalidateSize(); }, 150);
    }

    function exitManual() {
      manualActive = false;
      L.DomUtil.removeClass(mapContainer, 'leaflet-fake-fullscreen');
      document.body.style.overflow = '';
      updateIcon();
      setTimeout(function () { map.invalidateSize(); }, 150);
    }

    L.DomEvent.on(link, 'click', function (e) {
      L.DomEvent.preventDefault(e);
      L.DomEvent.stopPropagation(e);

      if (manualActive) { exitManual(); return; }

      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }

      if (nativeSupported) {
        try {
          const req = mapContainer.requestFullscreen
            ? mapContainer.requestFullscreen()
            : mapContainer.webkitRequestFullscreen();
          // بعض المتصفحات تُرجع Promise يُرفض فعليًا دون دعم حقيقي؛ في هذه الحالة
          // ننتقل تلقائيًا للبديل القائم على CSS
          if (req && typeof req.catch === 'function') {
            req.catch(function () { enterManual(); });
          }
        } catch (err) {
          enterManual();
        }
      } else {
        enterManual();
      }
    });

    document.addEventListener('fullscreenchange', function () {
      updateIcon();
      setTimeout(function () { map.invalidateSize(); }, 150);
    });
    document.addEventListener('webkitfullscreenchange', function () {
      updateIcon();
      setTimeout(function () { map.invalidateSize(); }, 150);
    });

    // يسمح بالخروج من الوضع البديل بمفتاح Escape مثل الشاشة الكاملة الحقيقية
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && manualActive) exitManual();
    });

    L.DomEvent.disableClickPropagation(container);
    return container;
  }
});
map.addControl(new FullscreenControl());

let marker = null;

function checkPoint() {
  const val = document.getElementById('coordInput').value;
  const resultDiv = document.getElementById('result');
  const echoDiv = document.getElementById('coordsEcho');
  const coords = extractCoordinates(val);

  if (!coords) {
    resultDiv.className = 'result error';
    resultDiv.textContent = '⚠️ لم أتمكن من قراءة الإحداثية. تأكد من الصيغة المدخلة.';
    echoDiv.textContent = '';
    return;
  }

  const [lat, lng] = coords;
  const inside = isPointInPolygon([lat, lng], polygonCoords);

  if (marker) map.removeLayer(marker);
  marker = L.marker([lat, lng], {
    icon: L.divIcon({
      className: '',
      html: `<div style="background:${inside ? '#22c55e' : '#ef4444'};width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 0 6px rgba(0,0,0,0.5);"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    })
  }).addTo(map);
  map.setView([lat, lng], 13);

  echoDiv.textContent = `الإحداثية: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;

  if (inside) {
    resultDiv.className = 'result inside';
    resultDiv.textContent = '✅ الإحداثية داخل حدود الدمام';
  } else {
    resultDiv.className = 'result outside';
    resultDiv.textContent = '❌ الإحداثية خارج حدود الدمام';
  }
}

document.getElementById('coordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPoint();
});

} catch (fatalError) {
  console.error('خطأ فادح أثناء تشغيل الخريطة:', fatalError);
  var resultDiv = document.getElementById('result');
  if (resultDiv) {
    resultDiv.className = 'result error';
    resultDiv.textContent = '⚠️ حدث خطأ أثناء تحميل الخريطة: ' + (fatalError && fatalError.message ? fatalError.message : fatalError);
  }
}
